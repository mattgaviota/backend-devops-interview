# Workload Identity binds this K8s ServiceAccount to a GCP Service Account so that
# the Cloud SQL Auth Proxy sidecar can authenticate to Cloud SQL without key files.
#
# GCP side (run once):
#   gcloud iam service-accounts create backend-devops-interview --project PROJECT_ID
#   gcloud projects add-iam-policy-binding PROJECT_ID \
#     --member="serviceAccount:backend-devops-interview@PROJECT_ID.iam.gserviceaccount.com" \
#     --role="roles/cloudsql.client"
#   gcloud iam service-accounts add-iam-policy-binding \
#     backend-devops-interview@PROJECT_ID.iam.gserviceaccount.com \
#     --role="roles/iam.workloadIdentityUser" \
#     --member="serviceAccount:PROJECT_ID.svc.id.goog[default/backend-devops-interview]"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-devops-interview
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: backend-devops-interview@PROJECT_ID.iam.gserviceaccount.com
